openapi: 3.0.3
info:
  title: Pinjamean Loans API
  version: "1.0"

paths:
  /loans:
    post:
      summary: Submit a new loan application
      operationId: submitLoan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitLoanRequest'
      responses:
        '204':
          description: Loan submitted successfully
        '400':
          description: Invalid request (missing/invalid fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /loans/{uuid}:
    get:
      summary: Get loan by loan's UUID
      operationId: getLoanByUuid
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Loan found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '404':
          description: Loan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /loans/{uuid}/assignment:
    patch:
      summary: Reassign a loan
      operationId: reassignLoan
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignLoanRequest'
      responses:
        '204':
          description: Loan reassigned successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Loan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /loans/{uuid}/approval:
    post:
      summary: Approve a pending loan
      description: The authenticated credit analyst approves the loan. Only pending loans can be approved.
      operationId: approveLoan
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Loan approved successfully
        '400':
          description: Loan is not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Loan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /loans/{uuid}/rejection:
    post:
      summary: Reject a pending loan
      description: The authenticated credit analyst rejects the loan. Only pending loans can be rejected, and a reason is required.
      operationId: rejectLoan
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectLoanRequest'
      responses:
        '204':
          description: Loan rejected successfully
        '400':
          description: Invalid request, missing reason, or loan is not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Loan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    LoanType:
      type: string
      enum:
        - KPR
        - KKB
        - KTA
        - KMG
        - KMK
        - KUR

    SubmitLoanRequest:
      type: object
      required:
        - borrowerUuid
        - amountIdr
        - termMonths
        - loanType
      properties:
        borrowerUuid:
          type: string
          format: uuid
        amountIdr:
          type: integer
          format: int64
          minimum: 1
        termMonths:
          type: integer
          minimum: 1
        loanType:
          $ref: '#/components/schemas/LoanType'

    ReassignLoanRequest:
      type: object
      required:
        - assignedToUuid
      properties:
        assignedToUuid:
          type: string
          format: uuid

    RejectLoanRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1

    LoanResponse:
      type: object
      required:
        - uuid
        - borrowerUuid
        - officerUuid
        - assignedToUuid
        - amountIdr
        - termMonths
        - loanType
        - interestRateApr
        - status
      properties:
        uuid:
          type: string
          format: uuid
        borrowerUuid:
          type: string
          format: uuid
        officerUuid:
          type: string
          format: uuid
        assignedToUuid:
          type: string
          format: uuid
        amountIdr:
          type: integer
          format: int64
        termMonths:
          type: integer
        loanType:
          $ref: '#/components/schemas/LoanType'
        interestRateApr:
          type: number
          format: float
        status:
          type: string

    ErrorResponse:
      type: object
      required:
        - slug
        - message
      properties:
        slug:
          type: string
        message:
          type: string
