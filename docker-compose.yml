name: 'pinjamean'

services:
  loans-http:
    build:
      context: docker/app
    volumes:
      - ./internal:/internal
      - ./.go/pkg:/go/pkg
      - ./.go-cache:/go-cache
    working_dir: /internal
    ports:
      - "127.0.0.1:7777:7777"
    env_file:
      - .env
    environment:
      SERVICE: loans
      SERVER_TO_RUN: http
      GOCACHE: /go-cache

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pinjamean
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pinjamean"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
